services:
  api:
    build: .
    environment:
      CAUREN_HISTORY_DB: /data/history.sqlite3
      CAUREN_API_KEY: ${CAUREN_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cauren_history:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/readiness', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  cauren_history:
