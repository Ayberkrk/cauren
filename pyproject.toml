[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cauren"
version = "0.2.0"
description = "Research study on vibration-based damage detection for bridges: operational modal analysis, environmental normalization, and novelty detection on public monitoring datasets."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ayberk Korkmaz" }]

# cauren_physics has no required third-party dependencies: numpy and
# timoshenko-engine are soft-imported (see cauren_physics/oma.py and
# cauren_physics/timoshenko_adapter.py) with pure-Python fallbacks.
dependencies = []

[project.optional-dependencies]
# Run the test suite: `pip install -e .[test]`, then `python3 -m pytest tests/`.
test = [
  "pytest>=7",
]
# Bridge case studies (tools/kw51_study.py) and faster OMA spectra.
study = [
  "numpy>=1.24",
  "scipy>=1.10",
]
# Repository lint checks (kept out of the runtime and test extras).
lint = [
  "ruff>=0.11,<1",
]

[project.urls]
Homepage = "https://github.com/Ayberkrk/cauren"
Issues = "https://github.com/Ayberkrk/cauren/issues"

[tool.hatch.build.targets.wheel]
packages = ["cauren_physics", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"] # CLI tools add the repository root to sys.path before importing project modules.
